# ═══════════════════════════════════════════════════════════
# docker-compose.yml — GLiNER2 Multilingual Extraction System
# ═══════════════════════════════════════════════════════════
#
# Quick start:
#   docker-compose up --build
#
# With GPU:
#   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# ═══════════════════════════════════════════════════════════

version: "3.9"

services:
  gliner2-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gliner2-multilingual
    ports:
      - "8000:8000"
    volumes:
      # Mount adapters and MoE model from host if available
      - ./adapters:/app/adapters
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Set to "cuda:0" if GPU available
      - DEVICE=cpu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Models take time to load
